services:
  mtls-chain-doctor:
    build:
      context: .
      dockerfile: Dockerfile
    image: mtls-chain-doctor:1.0.0
    container_name: mtls-chain-doctor
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
