[project]
name = "mtls-chain-doctor"
version = "1.0.0"
description = "Offline mTLS client certificate chain diagnostics (intermediate missing vs cross-sign path selection)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "cryptography>=42.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
